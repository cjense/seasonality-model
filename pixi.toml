[workspace]
authors = ["Claire <clairej735@gmail.com>"]
channels = ["rapidsai", "nvidia", "conda-forge"]
name = "seasonality-model"
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "12" }]
version = "0.1.0"

[environments]
seasonality-model = ["default"]

[tasks]

[dependencies]
numpy = ">=2.5.3,<3"
xgboost = { version = ">=3.4.2,<4", build = "cuda*" }
nccl = { version = "*", channel = "conda-forge" }
dask = ">=2026.8.0,<2027"
pandas = ">=3.0.6,<4"
xarray = ">=2026.7.0,<2027"
shap = ">=0.52.0,<0.53"
matplotlib = ">=3.11.2,<4"
jupyter = ">=1.1.1,<2"
s3fs = ">=2026.7.0,<2027"
boto3 = ">=1.43.75,<2"
tabulate = "*"
zarr = ">=3.4.1,<4"
skforecast = ">=0.24.0,<0.25"

[pypi-dependencies]
geoshapley = ">=0.2.0.0, <0.3"
