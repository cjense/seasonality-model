[workspace]
authors = ["Claire <clairej735@gmail.com>"]
channels = ["rapidsai", "nvidia", "conda-forge"]
name = "seasonality-model"
platforms = ["linux-64"]
version = "0.1.0"

[environments]
seasonality-model = ["default"]

[tasks]
clone-shap = { cmd = "git clone https://github.com/shap/shap.git", outputs = ["shap/"] } # Build SHAP from GitHub to use GPUTreeExplainer
set-cuda-path = "export CUDA_PATH=$CONDA_PREFIX"
build-shap = { cmd = "pip install --no-build-isolation -e .", cwd = "shap", depends-on = ["clone-shap"] }

[dependencies]
python = ">=3.11"
numpy = ">=2.5.3,<3"
xgboost = "*"
dask = ">=2026.8.0,<2027"
pandas = ">=3.0.6,<4"
xarray = ">=2026.7.0,<2027"
matplotlib = ">=3.11.2,<4"
jupyter = ">=1.1.1,<2"
s3fs = ">=2026.7.0,<2027"
boto3 = ">=1.43.75,<2"
tabulate = ">=0.10.0,<0.11"
cuda-toolkit = ">=12.0,<13"
pyarrow = "*"

[pypi-dependencies]
geoshapley = ">=0.2.0.0, <0.3"
shap = { path = "shap", editable = true }  # source build for GPU support