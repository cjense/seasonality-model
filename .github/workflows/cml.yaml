name: Random Forest & SHAP

on: [push, pull_request]

permissions:
  contents: write       # commit comments on push events
  pull-requests: write  # PR comments

jobs:
  random-forest:
    runs-on: [self-hosted, slurm, gpu, tillicum, cuda]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure pixi environment location
        # Keep the env outside the checkout so `git clean` doesn't wipe it every run.
        run: pixi config set --local detached-environments /gpfs/scrubbed/jensencc/pixi-envs

      - name: Train random forest and run SHAP
        run: pixi run -e seasonality-model python -u run_rf.py

      - name: Upload figures to S3
        run: |
          pixi run -e seasonality-model python - <<'PY'
          import os, s3fs
          fs = s3fs.S3FileSystem(key=os.environ["AWS_ACCESS_KEY_ID"], secret=os.environ["AWS_SECRET_ACCESS_KEY"],
                                 client_kwargs={"endpoint_url": os.environ["S3_ENDPOINT_URL"]},
                                 config_kwargs={"request_checksum_calculation": "when_required",
                                                "response_checksum_validation": "when_required"})
          import glob
          for path in glob.glob("figures/*.png"):
              fs.put(path, f"gaia/cjense/ci-figures/{os.environ['GITHUB_RUN_ID']}/{os.path.basename(path)}",
                     ACL="public-read", ContentType="image/png")
          PY

      - name: Report results
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # run_rf.py writes image links as FIGURE_URL/<name>.png under each run's section
          FIG_URL="${S3_ENDPOINT_URL}/gaia/cjense/ci-figures/${GITHUB_RUN_ID}"
          sed -i "s|FIGURE_URL|${FIG_URL}|g" modelresults.md

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            URL="https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          else
            URL="https://api.github.com/repos/${{ github.repository }}/commits/${GITHUB_SHA}/comments"
          fi
          curl -s -X POST \
            -H "Authorization: token ${REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$URL" \
            -d "{\"body\": $(python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' < modelresults.md)}"
