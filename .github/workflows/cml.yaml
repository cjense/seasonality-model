name: Model Training & SHAP Analysis

on: [push, pull_request]

jobs:
  train-and-evaluate:
    runs-on: [self-hosted, slurm, gpu, tillicum, cuda]

    env:
      CUDA_VISIBLE_DEVICES: "0,1"
      XGB_GPU: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GPU access
        run: nvidia-smi

      - name: Clone SHAP for GPU build
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/shap" ]; then
            git clone https://github.com/shap/shap.git "$GITHUB_WORKSPACE/shap"
          fi

      - name: Train model
        working-directory: ${{ github.workspace }}
        run: pixi run -e seasonality-model python testsmallmodel.py

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Report results
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model metrics" > report.md
          cat metrics.txt >> report.md
          echo "![](./figures/beeswarm.png)" >> report.md
          echo "![](./figures/heatmap.png)" >> report.md
          cml comment create report.md