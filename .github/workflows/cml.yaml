name: Model Training & SHAP Analysis

on: [push, pull_request]

jobs:
  auto-todos:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: "actions/checkout@v6"
      - name: "TODO to Issue"
        uses: "alstr/todo-to-issue-action@v5"
        with:
          INSERT_ISSUE_URLS: "true"
      - name: Set Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Commit and Push Changes
        run: |
          git add -A
          if [[ `git status --porcelain` ]]; then
            git commit -m "Automatically added GitHub issue links to TODOs"
            git push origin main
          else
            echo "No changes to commit"
          fi

  train-and-evaluate:
    runs-on: [self-hosted, slurm, gpu, tillicum, cuda]

    env:
      CUDA_VISIBLE_DEVICES: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GPU access
        run: |
          echo "Checking GPU availability..."
          nvidia-smi

      - name: Train model
        run: pixi run -e seasonality-model python testsmallmodel.py

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Report results
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model metrics" > report.md
          cat metrics.txt >> report.md
          echo "![](./figures/xgboost_result.png)" >> report.md
          echo "![](./figures/beeswarm.png)" >> report.md
          echo "![](./figures/heatmap.png)" >> report.md
          cml comment create report.md

      # - name: Run SHAP analysis
      #   run: pixi run -e seasonality-model python shap_analysis.py

      # - name: Generate figures
