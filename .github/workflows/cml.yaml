name: Model Training & SHAP Analysis

on: [push, pull_request]

permissions:
  contents: write       # commit comments on push events
  pull-requests: write  # PR comments

jobs:

  train-and-evaluate:
    # TODO: maybe rename these things
    runs-on: [self-hosted, slurm, gpu, tillicum, cuda]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GPU access
        run: |
          echo "Checking GPU availability..."
          nvidia-smi

      - name: Preprocess data
        run: |
          set -x
          date
          pixi run -e seasonality-model python -u preprocess.py
          date

      - name: Train model
        run: |
          set -x
          date
          pixi run -e seasonality-model python -u run_xgboost.py
          date

      - name: Calculate SHAP values
        run: |
          set -x
          date
          pixi run -e seasonality-model python -u run_shap.py
          date

      - name: Calculate GeoShapley values
        run: |
          set -x
          date
          pixi run -e seasonality-model python -u run_geoshapley.py
          date

      - name: Upload figures to S3
        run: |
          pixi run -e seasonality-model python - <<'PY'
          import os, s3fs
          fs = s3fs.S3FileSystem(
              key=os.environ["AWS_ACCESS_KEY_ID"],
              secret=os.environ["AWS_SECRET_ACCESS_KEY"],
              client_kwargs={"endpoint_url": os.environ["S3_ENDPOINT_URL"]},
          )
          for name in ["xgboost_result.png", "beeswarm.png", "heatmap.png"]:
              fs.put(f"figures/{name}",
                     f"gaia/cjense/ci-figures/{os.environ['GITHUB_RUN_ID']}/{name}",
                     ACL="public-read", ContentType="image/png")
          PY

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Report results
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FIG_URL="${S3_ENDPOINT_URL}/gaia/cjense/ci-figures/${GITHUB_RUN_ID}"
          echo "## Figures" >> modelresults.md
          echo "![](${FIG_URL}/xgboost_result.png)" >> modelresults.md
          echo "![](${FIG_URL}/beeswarm.png)" >> modelresults.md
          echo "![](${FIG_URL}/heatmap.png)" >> modelresults.md
          cml comment create --no-publish modelresults.md
