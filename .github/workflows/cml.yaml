name: Model Training & SHAP Analysis

on: [push, pull_request]

jobs:
  train-and-evaluate:
    runs-on: [self-hosted, slurm, gpu, tillicum, cuda]

    env:
      CUDA_VISIBLE_DEVICES: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GPU access
        run: |
          echo "Checking GPU availability..."
          nvidia-smi
          echo "CUDA version:"
          nvcc --version

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.66.0
          cache: true

      - name: Train model
        run: pixi run -e seasonality-model python train_model.py

      - name: Run SHAP analysis
        run: pixi run -e seasonality-model python shap_analysis.py

      - name: Generate figures
        run: pixi run -e seasonality-model python generate_figures.py

      - name: Report results to PR
        run: pixi run -e seasonality-model cml comment create --file figures/results.md

